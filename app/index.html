<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE COVER — GTA-style poster maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <h1>VICE&nbsp;COVER</h1>
  <p class="tagline">Multi-panel GTA-style poster maker — offline, your photos never leave this page.</p>
</header>
<main class="app">
  <aside class="controls">
    <section class="group">
      <h2>Photos</h2>
      <label class="btn-file">Add photos<input id="photos" type="file" accept="image/*" multiple hidden></label>
      <div id="strips" class="strips"><p class="hint">No photos yet.</p></div>
      <button id="fill-all" type="button">Use selected photo on all panels</button>
    </section>

    <section class="group">
      <h2>Layout</h2>
      <div class="seg" id="panel-count" role="radiogroup" aria-label="Panel count">
        <button type="button" data-n="3">3 panels</button>
        <button type="button" data-n="4">4 panels</button>
        <button type="button" data-n="5">5 panels</button>
      </div>
    </section>

    <section class="group">
      <h2>Panel <span id="panel-label">1</span><span id="panel-of"> / 5</span></h2>
      <label>Zoom <span id="zoom-val" class="val">1.00×</span>
        <input id="zoom" type="range" min="100" max="300" step="1" value="100" aria-label="Zoom">
      </label>
      <label>Offset X <span id="panx-val" class="val">0</span>
        <input id="panx" type="range" min="-50" max="50" step="1" value="0" aria-label="Horizontal offset">
      </label>
      <label>Offset Y <span id="pany-val" class="val">0</span>
        <input id="pany" type="range" min="-50" max="50" step="1" value="0" aria-label="Vertical offset">
      </label>
      <p class="hint">Click a panel to edit it, or drag the photo to pan. Pick a photo below (or above) to assign it to the selected panel.</p>
    </section>

    <section class="group">
      <h2>Caption</h2>
      <input id="caption" type="text" maxlength="48" value="Sunset Heist" aria-label="Caption text">
    </section>

    <section class="group">
      <h2>Colour grade</h2>
      <div class="seg" id="grade" role="radiogroup" aria-label="Colour grade">
        <button type="button" data-g="sunset">Sunset</button>
        <button type="button" data-g="neon">Neon</button>
      </div>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
    </section>

    <section class="group">
      <h2>Export</h2>
      <label>Size
        <select id="export-size">
          <option value="1080x1080">1080 × 1080 (square)</option>
          <option value="1080x1350">1080 × 1350 (portrait)</option>
          <option value="1920x1080">1920 × 1080 (landscape)</option>
        </select>
      </label>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </aside>

  <section class="stage">
    <canvas id="preview" width="720" height="720" aria-label="Poster preview"></canvas>
    <div class="panel-tabs" id="panel-tabs"></div>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
